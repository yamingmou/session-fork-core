# 三平台 CI：Linux / macOS / Windows
#
# 为什么需要它（2026-09-18 立）：本技能此前 13 个版本**全部只在 macOS 本机手测**，
# 于是"只在目标平台才暴露"的缺陷在结构上不可能被发现 —— 中文 Windows 的输出编码
# 就是实例（cp936 编不了 emoji，stdout 的 strict 直接把命令打断，退出码 1）。
# 本工作流把这类问题变成可回归的：三平台跑同一套测试 + 换行符一致性 + 产物一致性。
#
# 注：Windows runner 走 Git Bash（shell: bash），但 Python 仍是**原生 Windows** Python，
# 因此其 stdout 编码/文件系统语义就是真实 Windows 行为 —— 能测出真问题。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: ubuntu-latest,  python: "3.9" } # 兜住 requires-python 下限
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 编译（含「被当脚本直接执行」的入口）
        run: python -m py_compile fork_core/*.py scripts/*.py

      - name: 全量测试
        # 测试里的 print 是「给开发者的报告」，不是产品行为，故统一给 UTF-8 让日志可读。
        # 产品侧的编码行为由 tests/test_output_encoding.py（自带编码控制、跨平台可跑）
        # 与下面的「Windows 真实编码冒烟」共同覆盖。
        env:
          PYTHONIOENCODING: utf-8
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "───────── $f"
            python "$f" || fail=1
          done
          exit $fail

      - name: Windows 真实编码冒烟（**故意不设**任何编码环境变量）
        if: runner.os == 'Windows'
        run: |
          # runner 是英文 Windows（cp1252）—— 最严苛的场景：它连 ✓ 都编不了。
          # 本步不设 PYTHONIOENCODING，让 Python 用 Windows 的真实 locale。
          # 探针用 ASCII 转义书写（避免把非 ASCII 塞进命令行传参）。
          # 若没有 harden_output()，下面这条会以 UnicodeEncodeError、退出码 1 失败。
          python -c "import sys;sys.path.insert(0,'.');from fork_core.adapter_base import harden_output;harden_output();print('\u4e2d\u6587\u4e0e emoji\uff1a\u4f1a\u8bdd\u5206\u53c9 \u2705 \U0001f500');print('SMOKE-OK')"
          echo "✅ 未设编码变量也能正常输出（harden_output 在真实 locale 下生效）"

      - name: 换行符一致性（文本一律 LF；CRLF 会让跨平台产物不一致）
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /crlf/ || $2 ~ /crlf/ {print}')
          if [ -n "$bad" ]; then
            echo "::error::以下文件含 CRLF，违反 .gitattributes 的 eol=lf 约定："
            echo "$bad"
            exit 1
          fi
          echo "✅ 全部 LF"

      - name: 文档产物与源一致（SKILL.md 是构建产物，不能手改）
        run: |
          # 比对 git 跟踪的产物：先按源重建，再要求工作区无差异。
          # （不用 --check：它还要求 dist/SKILL.fork.md 存在，而 dist/ 未入版本库）
          python scripts/build_skill.py >/dev/null
          if ! git diff --quiet -- SKILL.md; then
            echo "::error::SKILL.md 与 skill/SKILL.src.md 不一致 —— 请跑 build_skill.py 后提交"
            git diff --stat -- SKILL.md
            exit 1
          fi
          echo "✅ SKILL.md 与源一致"

      - name: --pack 打包自检（堵 Windows cwd=/tmp 盲区）
        run: python scripts/build_skill.py --pack
